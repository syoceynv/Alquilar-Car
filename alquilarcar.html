<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alquilar Car Auth</title>
  <link href="output.css" rel="stylesheet">
</head>

<body class="bg-black flex items-center justify-center min-h-screen">

  <div class="flex gap-8">

    <!-- LOGIN -->
    <div class="bg-gray-100 w-[400px] h-[520px] rounded-lg flex flex-col items-center p-6 relative">

      <!-- Back Button -->
      <div class="absolute top-4 left-4 w-8 h-8 bg-blue-500 text-white rounded-full flex items-center justify-center cursor-pointer">
        ←
      </div>

      <!-- Logo -->
      <div class="flex flex-col items-center mt-6">
        <img src="https://cdn-icons-png.flaticon.com/512/743/743131.png" class="w-16">
        <h1 class="font-bold text-gray-800 mt-2">ALQUILAR</h1>
        <span class="text-xs tracking-widest text-gray-500">CAR</span>
      </div>

      <!-- Title -->
      <p class="text-sm mt-6 text-gray-700">Masuk ke akun Anda</p>

      <!-- Input -->
      <div class="w-full mt-4 space-y-3">
        <input type="text" placeholder="User name or Email"
          class="w-full px-4 py-2 rounded-full bg-gray-200 outline-none text-sm">

        <input type="password" placeholder="Password"
          class="w-full px-4 py-2 rounded-full bg-gray-200 outline-none text-sm">
      </div>

      <!-- Forgot -->
      <div class="w-full text-right text-xs mt-1 text-gray-500 cursor-pointer">
        Forgot Password?
      </div>

      <!-- Button -->
      <button class="w-full mt-6 bg-blue-600 text-white py-2 rounded-full text-sm hover:bg-blue-700">
        sign-in
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-2 my-4 w-full">
        <hr class="flex-1 border-gray-300">
        <span class="text-xs text-gray-500">or</span>
        <hr class="flex-1 border-gray-300">
      </div>

      <!-- Google -->
      <button class="w-full flex items-center justify-center gap-2 bg-gray-200 py-2 rounded-full text-sm">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4">
        sign-in With google
      </button>

    </div>

    <!-- REGISTER -->
    <div class="bg-gray-100 w-[400px] h-[520px] rounded-lg flex flex-col items-center p-6 relative">

      <!-- Back Button -->
      <div class="absolute top-4 left-4 w-8 h-8 bg-blue-500 text-white rounded-full flex items-center justify-center cursor-pointer">
        ←
      </div>

      <!-- Logo -->
      <div class="flex flex-col items-center mt-6">
        <img src="https://cdn-icons-png.flaticon.com/512/743/743131.png" class="w-16">
        <h1 class="font-bold text-gray-800 mt-2">ALQUILAR</h1>
        <span class="text-xs tracking-widest text-gray-500">CAR</span>
      </div>

      <!-- Form -->
      <div class="w-full mt-6 space-y-3">

        <input type="text" placeholder="Name"
          class="w-full px-4 py-2 rounded-full bg-gray-200 outline-none text-sm">

        <input type="email" placeholder="Email Address"
          class="w-full px-4 py-2 rounded-full bg-gray-200 outline-none text-sm">

        <input type="password" placeholder="Password"
          class="w-full px-4 py-2 rounded-full bg-gray-200 outline-none text-sm">

        <input type="password" placeholder="Confirm Password"
          class="w-full px-4 py-2 rounded-full bg-gray-200 outline-none text-sm">
      </div>

      <!-- Button -->
      <button class="w-full mt-6 bg-blue-600 text-white py-2 rounded-full text-sm hover:bg-blue-700">
        Create account
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-2 my-4 w-full">
        <hr class="flex-1 border-gray-300">
        <span class="text-xs text-gray-500">or</span>
        <hr class="flex-1 border-gray-300">
      </div>

      <!-- Google -->
      <button class="w-full flex items-center justify-center gap-2 bg-gray-200 py-2 rounded-full text-sm">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4">
        sign-in With google
      </button>

    </div>

  </div>

</body>
</html>
